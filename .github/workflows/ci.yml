name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo test --locked --offline
      - run: cargo build --release --locked --offline
      - run: cargo run --release --locked --offline -- demo
      - run: cargo run --locked --offline --example consumer
      - run: python scripts/check_json.py
      - run: python scripts/check_consumer.py
      - name: Installed CLI consumer
        shell: bash
        run: |
          cargo install --path . --locked --offline --root install-test
          ./install-test/bin/hidweave demo
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.85.0
      - run: cargo test --locked --offline
  parser-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly-2026-10-06
      - name: AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          CARGO_TARGET_DIR: target/asan
        run: cargo test --locked --offline --target x86_64-unknown-linux-gnu --lib --tests
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: python scripts/seed_fuzz.py
      - run: cargo fuzz run descriptor -- -max_total_time=30 -max_len=65535 -rss_limit_mb=1024
      - name: Retain failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          path: fuzz/artifacts/
          if-no-files-found: ignore
  independent-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install hid-parser==0.1.0
      - run: .venv/bin/python scripts/differential.py
