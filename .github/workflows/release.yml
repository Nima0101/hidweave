name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require successful CI and Security on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_gate.py
  artifacts:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
      - name: Check version and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python -c 'import json,os,subprocess; m=json.loads(subprocess.check_output(["cargo","metadata","--no-deps","--format-version","1"])); assert os.environ["RELEASE_TAG"] == "v"+m["packages"][0]["version"]'
      - run: cargo test --locked --offline
      - name: Build without workspace paths
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=."
          cargo build --release --locked --offline
      - name: Archive binary and license
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/archive_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: python scripts/release_checksums.py
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file docs/release-notes.md
